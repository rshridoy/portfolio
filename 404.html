<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page not found - Md. Rabius Sani Portfolio">
    <title>404 - Page Not Found | Md. Rabius Sani</title>
    <link rel="icon" href="images/favicon.ico">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .error-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 0 20px;
            background-color: var(--dark-bg);
            color: var(--white);
        }
        .error-code {
            font-size: 120px;
            font-weight: 700;
            margin: 0;
            color: var(--primary-color);
        }
        .error-message {
            font-size: 28px;
            margin-bottom: 30px;
        }
        .error-description {
            font-size: 18px;
            margin-bottom: 40px;
            max-width: 600px;
        }
    </style>
</head>
<body>
    <div class="error-page">
        <h1 class="error-code">404</h1>
        <h2 class="error-message">Page Not Found</h2>
        <p class="error-description">The page you are looking for doesn't exist or has been moved.</p>
        <a href="/" class="btn primary-btn">Back to Home</a>
    </div>
</body>
</html>
